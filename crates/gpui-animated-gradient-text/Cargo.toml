[package]
name = "gpui-animated-gradient-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fast, Unicode-aware animated gradient text for GPUI"
documentation = "https://docs.rs/gpui-animated-gradient-text"
readme = "README.md"
keywords = ["gpui", "gradient", "animation", "text", "ui"]
categories = ["gui", "rendering"]
include = [
    "src/**",
    "examples/**",
    "benches/**",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.13"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "gradient_runs"
harness = false

[package.metadata.docs.rs]
all-features = true
