[package]
name = "graph-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
standalone-harness = []

[[bin]]
name = "graph-demo"
path = "src/main.rs"
required-features = ["standalone-harness"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
graph-model = { path = "../../crates/graph-model" }
graph-render-wgpu = { path = "../../crates/graph-render-wgpu" }
hashbrown.workspace = true
memchr = "2.7"
memmap2 = "0.9"
pollster = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu.workspace = true
winit.workspace = true
